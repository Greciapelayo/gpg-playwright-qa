<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a facial | GPG Grand Petit Glow</title><link rel="stylesheet" href="/style.css"></head>
<body><script src="/nav.js"></script>
<main>
<h1>Book a facial</h1>
<form id="booking-form" novalidate>
  <label for="service">Service</label><select id="service" required><option value="">Choose a service</option></select>
  <label for="date">Date</label><input id="date" type="date" required>
  <div class="slots" data-testid="slots"></div>
  <p data-testid="no-slots" hidden>No availability on this date.</p>
  <label for="name">Name</label><input id="name" required>
  <label for="email">Email</label><input id="email" type="email" required>
  <p class="error" data-testid="booking-error" role="alert"></p>
  <button type="submit">Confirm booking</button>
</form>
<p class="success" data-testid="booking-confirmation" hidden></p>
<script>
  let selectedTime = null;
  const $ = (s) => document.querySelector(s);
  fetch("/api/services").then(r => r.json()).then(list => list.forEach(s =>
    $("#service").insertAdjacentHTML("beforeend", `<option value="${s.id}">${s.name} - $${s.price}</option>`)));
  $("#date").addEventListener("change", async () => {
    selectedTime = null;
    const { slots } = await fetch(`/api/slots?date=${$("#date").value}`).then(r => r.json());
    $("[data-testid=slots]").innerHTML = slots.map(t => `<button type="button" data-time="${t}">${t}</button>`).join("");
    $("[data-testid=no-slots]").hidden = slots.length > 0;
    document.querySelectorAll("[data-time]").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll("[data-time]").forEach(x => x.classList.remove("selected"));
      b.classList.add("selected"); selectedTime = b.dataset.time;
    }));
  });
  $("#booking-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = { serviceId: $("#service").value, date: $("#date").value, time: selectedTime, name: $("#name").value, email: $("#email").value };
    const res = await fetch("/api/bookings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { $("[data-testid=booking-error]").textContent = data.errors ? `Please check: ${data.errors.join(", ")}` : data.error; return; }
    $("#booking-form").hidden = true;
    const c = $("[data-testid=booking-confirmation]");
    c.hidden = false; c.textContent = `Booking ${data.id} confirmed for ${data.date} at ${data.time}.`;
  });
</script>
</main></body></html>
