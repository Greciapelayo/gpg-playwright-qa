<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | GPG Grand Petit Glow</title><link rel="stylesheet" href="/style.css"></head>
<body><script src="/nav.js"></script>
<main>
<h1>Contact us</h1>
<form id="contact-form" novalidate>
  <label for="ct-name">Name</label><input id="ct-name" required>
  <label for="ct-email">Email</label><input id="ct-email" type="email" required>
  <label for="ct-message">Message</label><textarea id="ct-message" rows="4" required></textarea>
  <p class="error" data-testid="contact-error" role="alert"></p>
  <button type="submit">Send message</button>
</form>
<p class="success" data-testid="contact-confirmation" hidden>Thank you! We will get back to you within 48 hours.</p>
<script>
  const $ = (s) => document.querySelector(s);
  $("#contact-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = { name: $("#ct-name").value, email: $("#ct-email").value, message: $("#ct-message").value };
    const res = await fetch("/api/contact", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) { const { errors } = await res.json(); $("[data-testid=contact-error]").textContent = `Please check: ${errors.join(", ")}`; return; }
    $("#contact-form").hidden = true; $("[data-testid=contact-confirmation]").hidden = false;
  });
</script>
</main></body></html>
